# Server Config
server.port=8080

# PostgreSQL + PostGIS Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/varithon_emergency
spring.datasource.username=varithon
spring.datasource.password=varithon_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Config
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MQTT Config
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=varithon_backend_service

# Firebase Config (Place your service account json in resources)
firebase.config.path=classpath:firebase-service-account.json
